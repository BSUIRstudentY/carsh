spring:
  application:
    name: carsharing-api
  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,kafka
  metrics:
    tags:
      application: carsharing-api

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-min-32-bytes-long-change-in-production-xx}
    access-token-validity: PT15M
    refresh-token-validity: P7D
  telemetry:
    rate-limit-seconds: 0
    ttl-days: 90
    simulate-api-key: ${TELEMETRY_API_KEY:dev-telemetry-key-change-in-prod}
    deduplicate-identical-coordinates: false

---
# Локальная разработка: H2 in-memory. Консоль H2 только в браузере приложения (тот же JVM, что и Spring).
# Откройте http://localhost:8080/h2-console и укажите:
#   JDBC URL: jdbc:h2:mem:carsharing
#   User Name: sa
#   Password: (оставить пустым)
# Отдельный клиент «Generic H2 (Embedded)» с jdbc:h2:~/test к этой БД не подключится — это другой файл/процесс.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:carsharing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    mongodb:
      uri: mongodb://localhost:27017/carsharing
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: carsharing-telemetry
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 100
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      type: batch

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carsharing}
    username: ${SPRING_DATASOURCE_USERNAME:carsharing}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
